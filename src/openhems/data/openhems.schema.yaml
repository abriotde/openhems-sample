{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "title": "OpenHEMS Configuration Schema",
  "description": "Schéma de validation pour openhems.yaml",
  "type": "object",
  "properties": {
    "api": {
      "type": "object",
      "properties": {
        "url": {
          "type": "string",
          "format": "uri",
          "description": "URL de l'API Home Assistant (ex: http://...:8123/api)"
        },
        "long_lived_token": {
          "type": "string",
          "description": "Token d'accès permanent Home Assistant"
        },
        "ssl_certificate": {
          "type": "string",
          "description": "Chemin ou contenu du certificat SSL (optionnel)"
        }
      },
      "required": [],
      "additionalProperties": false
    },
    "localization": {
      "type": "object",
      "properties": {
        "latitude": {
          "type": "number",
          "minimum": -90,
          "maximum": 90,
          "description": "Latitude en degrés décimaux"
        },
        "longitude": {
          "type": "number",
          "minimum": -180,
          "maximum": 180,
          "description": "Longitude en degrés décimaux"
        },
        "altitude": {
          "type": "integer",
          "description": "Altitude en mètres (optionnel)"
        },
        "timeZone": {
          "type": "string",
          "description": "Fuseau horaire (ex: Europe/Paris)"
        }
      },
      "required": ["latitude", "longitude", "timeZone"],
      "additionalProperties": false
    },
    "server": {
      "type": "object",
      "properties": {
        "logfile": {
          "type": "string",
          "default": "",
          "description": "Path for log file"
        },
        "loglevel": {
          "type": "string",
          "enum": ["debug", "info", "warning", "error", "critical"],
          "default": "info",
          "description": "log level : each level include log from lower level : exp: 'warning' will display 'error' and 'critical' logs but not 'info' and 'debug'"
        },
        "loopDelay": {
          "type": "integer",
          "minimum": 1,
          "default": 30,
          "description": "delay between server loops. More will decrease overload risk (and power consumption) but with lower reaction time."
        },
        "network": {
          "type": "string",
          "enum": ["homeassistant", "fake"],
          "default": "homeassistant",
          "description": "API used to get/set netwrk datas. Domoticz and Jeedom are not implemented yet."
        },
        "strategies": {
          "type": "array",
          "description": "Liste des stratégies actives",
          "items": {
            "type": "object",
            "properties": {
              "class": {
                "type": "string",
                "enum": ["offpeak", "emhass", "annealing", "switchoff"],
                "description": "Strategy class name (ex: offpeak, self_consumption)"
              },
              "id": {
                "type": "string",
                "description": "Uniq Id of the strategy"
              }
            },
            "required": ["class", "id"],
            "additionalProperties": false
          }
        }
      },
      "required": [],
      "additionalProperties": false
    },
    "network": {
      "type": "object",
      "properties": {
        "nodes": {
          "type": "array",
          "description": "Liste des nœuds (équipements, sources, charges)",
          "items": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "description": "Identifiant unique du nœud"
              },
              "class": {
                "type": "string",
                "enum": ["PublicPowerGrid", "switch", "battery", "pv", "heater", "ev"],
                "description": "Type de nœud"
              },
              "strategy": {
                "type": "string",
                "description": "Référence à une stratégie (optionnelle)"
              },
              "currentPower": {
                "type": "string",
                "description": "Entité Home Assistant pour la puissance instantanée"
              },
              "maxPower": {
                "type": "number",
                "description": " Maximal power in Watt"
              },
              "minPower": {
                "type": "number",
                "description": "Minimal power in Watt"
              },
              "powerMargin": {
                "type": "number",
                "description": "Marge de puissance (W) – pour le réseau public"
              },
              "isOn": {
                "type": "string",
                "description": "Home-Assistant id for on/off (for switch)"
              },
              "constraints": {
                "type": "object",
                "properties": {
                  "minPower": {
                    "type": "number",
                    "description": "Minimal power OpenHEMS should avoid to be under."
                  },
                  "minPowerDelay": {
                    "type": "integer",
                    "description": "minPower delay above witch OpenHEMS should react (seconds). "
                  }
                },
                "additionalProperties": false
              },
              "contract": {
                "type": "object",
                "description": "Electricity contract (for PublicPowerGrid)",
                "properties": {
                  "class": {
                    "type": "string",
                    "enum": ["RTETempo", "Base", "HeuresCreuses"],
                    "description": "contract type"
                  },
                  "color": {
                    "type": "string",
                    "description": "HA id for Tempo color (bleu/blanc/rouge)"
                  },
                  "nextcolor": {
                    "type": "string",
                    "description": "HA id for Tempo color for tomorow (bleu/blanc/rouge)"
                  },
                  "offpeakhoursranges": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "pattern": "^\\d{1,2}:|h(\\d{1,2})?\\s*-\\s*\\d{1,2}(:|h)(\\d{1,2})?$",
                      "description": "Hour range of offpeaks ex: '22h05 - 6h'"
                    },
                    "description": "Hour range of offpeaks"
                  }
                },
                "required": ["class"],
                "additionalProperties": false
              }
            },
            "required": ["id", "class", "currentPower", "maxPower"],
            "allOf": [
              {
                "if": {
                  "properties": { "class": { "const": "PublicPowerGrid" } }
                },
                "then": {
                  "required": ["powerMargin", "contract"]
                }
              },
              {
                "if": {
                  "properties": { "class": { "const": "switch" } }
                },
                "then": {
                  "required": ["isOn"]
                }
              }
            ]
          }
        }
      },
      "required": ["nodes"],
      "additionalProperties": false
    }
  },
  "required": ["api", "network"],
  "additionalProperties": false
}
